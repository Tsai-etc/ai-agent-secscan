[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-secscan"
version = "1.0.0"
authors = [
  { name="Tsai-etc", email="tsai.etc@gmail.com" },
]
description = "🛡️ AI Agent Security & Vulnerability Scanner - Automated tool for detecting RCE, SSRF, Prompt Injection, and Insecure Deserialization in LLM frameworks."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
agent-secscan = "cli:main"
